<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174EA6"><title>NeonIDE Mobile</title>
<style>
:root{--bg2:#0b0b0b;--bg3:#161616;--ln:#3d3d3d;--b:#174EA6;--o:#E37400;--mut:#a0a0a0;--fs:14px;--ts:2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:14px system-ui,Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:#fff;background:var(--bg3);border:1px solid var(--ln);border-radius:4px;padding:6px 11px}
button:active{background:var(--b)}
#top{display:flex;align-items:center;gap:2px;height:48px;padding:0 6px;background:var(--b);flex-shrink:0}
#top button{background:0;border:0;font-size:18px;padding:8px 10px}
#ttl{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
#top .run{background:var(--o);color:#000;font-size:14px;font-weight:700;padding:8px 14px;margin-left:4px}
#main{flex:1;display:flex;min-height:0;position:relative}
#side{position:absolute;z-index:6;top:0;bottom:0;left:0;width:260px;max-width:82%;background:var(--bg2);border-right:1px solid var(--ln);transform:translateX(-100%);transition:transform .15s;display:flex;flex-direction:column}
#side.open{transform:none}
#scrim{display:none;position:absolute;inset:0;z-index:5;background:#000a}#scrim.on{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:11px;letter-spacing:.08em;color:var(--mut)}
#fl{flex:1;overflow:auto}
.f{display:flex;align-items:center;gap:8px;padding:10px 10px;border-left:3px solid transparent}
.f.a{background:var(--bg3);border-left-color:var(--o)}
.f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .g{font-size:9px;font-weight:700;padding:2px 4px;border-radius:3px;color:#000}
.f .x{color:var(--mut);padding:2px 7px;font-size:15px}
@media(min-width:900px){#side{position:static;transform:none;width:240px}#scrim{display:none!important}}
#ws{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--ln);flex-shrink:0;scrollbar-width:none}
.t{padding:9px 14px;color:var(--mut);white-space:nowrap;border-right:1px solid var(--ln);border-top:2px solid transparent}
.t.a{color:#fff;background:#000;border-top-color:var(--o)}.t .x{margin-left:8px}
#find{display:none;gap:4px;padding:6px;background:var(--bg3);border-bottom:1px solid var(--ln);flex-wrap:wrap}#find.on{display:flex}
#find input{flex:1;min-width:110px;background:#000;color:#fff;border:1px solid var(--ln);border-radius:4px;padding:6px 8px;font:inherit}
#find input:focus{border-color:var(--o);outline:0}#fc{align-self:center;color:var(--mut);font-size:12px;min-width:48px}
#ed{flex:1;display:flex;min-height:0}
#gut,#hl,#ta{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-size:var(--fs);line-height:1.5;tab-size:var(--ts)}
#gut{width:42px;padding:10px 8px 60px 0;text-align:right;color:#8a8a8a;overflow:hidden;white-space:pre;user-select:none;flex-shrink:0;border-right:1px solid #222}
#box{position:relative;flex:1;min-width:0}
#hl,#ta{position:absolute;inset:0;margin:0;padding:10px 12px 60px;border:0;white-space:pre;overflow:auto;word-wrap:normal}
#hl{overflow:hidden;pointer-events:none}
#ta{background:0;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--o);resize:none;outline:0}
#ta::selection{background:#174EA6cc}
#pan{display:none;flex:0 0 45%;min-height:0;flex-direction:column;border-top:2px solid var(--b)}
#pan.on{display:flex}#pan.max{flex:1 1 100%}
#ph{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--ln)}
#ph .pt{padding:8px 14px;color:var(--mut);border-bottom:2px solid transparent}#ph .pt.a{color:#fff;border-bottom-color:var(--o)}
#ph .sp{flex:1}#ph button{border:0;background:0;font-size:16px}
#fr{display:none;flex:1;border:0;background:#fff;width:100%;min-height:0}#pan[data-t=pv] #fr{display:block}
#cv{display:none;flex:1;flex-direction:column;min-height:0}#pan[data-t=co] #cv{display:flex}
#co{flex:1;margin:0;padding:10px;overflow:auto;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;color:#e6e6e6}
#si{height:52px;background:#000;color:#fff;border:0;border-top:1px solid var(--ln);padding:6px 10px;font:13px ui-monospace,monospace;resize:none;outline:0}
#sug{display:none;gap:6px;overflow-x:auto;padding:5px 6px;background:var(--bg3);border-top:1px solid var(--ln);scrollbar-width:none}#sug.on{display:flex}
#sug button{flex-shrink:0;padding:5px 10px;border-color:var(--o);color:var(--o)}
#keys{display:flex;gap:4px;overflow-x:auto;padding:5px;background:var(--bg2);border-top:1px solid var(--ln);scrollbar-width:none}
#keys button{flex-shrink:0;min-width:38px;padding:7px 10px;font:15px ui-monospace,monospace}
#st{display:flex;gap:16px;align-items:center;height:26px;padding:0 10px;background:var(--b);font-size:12px;flex-shrink:0}
#st span:first-child{flex:1}
.c{color:#7ca668}.s{color:#ce9178}.k,.tg{color:#569cd6}.n{color:#b5cea8}.at{color:#9cdcfe}.pp{color:#c586c0}.ty{color:#4ec9b0}.fn{color:#dcdcaa}
#set{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}#set.on{display:flex}
#set .hd{display:flex;align-items:center;gap:10px;padding:0 8px;height:48px;background:var(--b);font-weight:600}
#set .hd button{background:0;border:0;font-size:20px}
#sb{flex:1;overflow:auto;padding:4px 14px 40px}
#sb h3{color:var(--o);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row b{color:var(--o);margin-left:6px}.row input[type=range]{width:46%;accent-color:var(--o)}
.row select{background:var(--bg3);color:#fff;border:1px solid var(--ln);border-radius:4px;padding:7px}
.sw{position:relative;width:44px;height:24px;flex-shrink:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--mut);border-radius:12px}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.15s}
.sw input:checked+i{background:var(--o);border-color:var(--o)}.sw input:checked+i:after{left:23px;background:#000}
.btns{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
#imp{width:100%;height:64px;background:var(--bg3);color:#fff;border:1px solid var(--ln);border-radius:4px;font:12px monospace;padding:8px}
.about{margin-top:8px;padding:20px 14px;border:1px solid var(--b);border-radius:6px;text-align:center}
.about .lg{font-size:22px;font-weight:700;letter-spacing:.08em}.about .lg i{color:var(--o);font-style:normal}
.about .v{color:var(--mut);font-size:12px;margin:4px 0 12px}.about .mb b{color:var(--o)}
.inf{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;margin:14px 0 0;color:var(--mut);text-align:left}
.inf span:nth-child(even){color:#fff;text-align:right}
</style></head><body>
<div id="app">
<header id="top"><button id="bm">☰</button><span id="ttl"></span><button id="bf">⌕</button><button id="bg">⚙</button><button class="run" id="br">▶ Uruchom</button></header>
<div id="main">
 <aside id="side"><div class="sh"><span>EKSPLORATOR</span><button id="bn">＋ Nowy</button></div><div id="fl"></div></aside><div id="scrim"></div>
 <section id="ws">
  <div id="tabs"></div>
  <div id="find"><input id="fi" placeholder="Znajdź"><input id="ri" placeholder="Zamień na"><button id="fp">▲</button><button id="fn">▼</button><button id="r1">Zamień</button><button id="ra">Wszystkie</button><span id="fc"></span></div>
  <div id="ed"><div id="gut"></div><div id="box"><pre id="hl"></pre><textarea id="ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div></div>

   <iframe id="fr" sandbox="allow-scripts allow-modals"></iframe>

 </section>
</div>

</div>
<div id="set"><div class="hd"><button id="sx">←</button>Ustawienia</div><div id="sb"></div></div>
<script>
const $=id=>document.getElementById(id),ta=$('ta');
const APP={ver:'2.0.0',build:'2026.11.07',code:'NIM-200'};
const DEF={"main.cpp":'#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << "Witaj w NeonIDE!" << endl;\n  return 0;\n}\n',
"index.html":'<!DOCTYPE html>\n<html lang="pl">\n<head>\n  <meta charset="UTF-8">\n  <title>Test</title>\n  <style>\n    body { font-family: sans-serif; text-align: center; margin-top: 3rem; }\n  </style>\n</head>\n<body>\n  <h1>Cześć!</h1>\n  <button onclick="console.log(\'Kliknięto\')">Kliknij</button>\n</body>\n</html>\n'};
let S;try{S=JSON.parse(localStorage.getItem('nide')||localStorage.getItem('neon')||'null')}catch(e){}
if(!S||!S.files)S={files:DEF,open:['main.cpp','index.html'],active:'main.cpp'};
S.set=Object.assign({fs:14,ts:2,ln:true,keys:true,ac:true,sg:true,autosave:true,compiler:'gcc-head'},S.set||{});
S.open=(S.open||[]).filter(n=>n in S.files);if(!(S.active in S.files))S.active=Object.keys(S.files)[0]||'main.cpp';
if(!(S.active in S.files))S.files[S.active]='';if(!S.open.includes(S.active))S.open.push(S.active);
const save=()=>{try{localStorage.setItem('nide',JSON.stringify(S))}catch(e){}};
const lang=(n=S.active)=>/\.html?$/i.test(n)?'html':'cpp';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const U=()=>' '.repeat(S.set.ts);
/* highlight */
function hl(t,re,cls){let o='',i=0,m;re.lastIndex=0;while((m=re.exec(t))){if(!m[0]){re.lastIndex++;continue}o+=esc(t.slice(i,m.index));let k=1;while(m[k]===undefined)k++;o+='<span class="'+cls[k-1]+'">'+esc(m[0])+'</span>';i=m.index+m[0].length}return o+esc(t.slice(i))}
const KW='alignas|auto|break|case|catch|class|const|constexpr|continue|default|delete|do|else|enum|explicit|extern|for|friend|goto|if|inline|namespace|new|noexcept|nullptr|operator|private|protected|public|return|sizeof|static|struct|switch|template|this|throw|try|typedef|typename|using|virtual|while|true|false';
const TY='int|long|short|char|float|double|bool|void|unsigned|signed|string|vector|map|set|size_t|cout|cin|endl|std';
const reC=new RegExp('(\\/\\/.*|\\/\\*[\\s\\S]*?(?:\\*\\/|$))|("(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?)|(^[ \\t]*#[ \\t]*\\w+)|\\b('+KW+')\\b|\\b('+TY+')\\b|\\b([A-Za-z_]\\w*)(?=\\()|\\b(\\d[\\w.]*)\\b','gm');
const clC=['c','s','pp','k','ty','fn','n'];
const reH=/(<!--[\s\S]*?(?:-->|$))|(<\/?[\w-]+|<!\w+|\/?>)|(\s[\w:-]+(?==))|((?<==)(?:"[^"]*"|'[^']*'))/g,clH=['c','tg','at','s'];
let raf=0,nl=0,tm=0,busy=false;
function render(){const t=ta.value;$('hl').innerHTML=(lang()==='html'?hl(t,reH,clH):hl(t,reC,clC))+'\n';
 const n=t.split('\n').length;if(n!==nl){nl=n;let g='';for(let i=1;i<=n;i++)g+=i+'\n';$('gut').textContent=g}sync();upd()}
const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
function sync(){$('hl').scrollTop=ta.scrollTop;$('hl').scrollLeft=ta.scrollLeft;$('gut').scrollTop=ta.scrollTop}
function upd(){const p=ta.selectionStart,b=ta.value.slice(0,p).split('\n');$('pos').textContent='Ln '+b.length+', Col '+(b[b.length-1].length+1);sugg()}
function reveal(i){const ln=ta.value.slice(0,i).split('\n').length-1;ta.scrollTop=Math.max(0,ln*S.set.fs*1.5-ta.clientHeight/3);sync()}
/* editing */
function ins(s,back){busy=true;ta.focus();if(!document.execCommand('insertText',false,s)){ta.setRangeText(s,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}busy=false;if(back){const e=ta.selectionEnd-back;ta.setSelectionRange(e,e)}}
const PAIR={'(':')','[':']','{':'}','"':'"',"'":"'"},VOID=/^(br|hr|img|input|meta|link|area|base|col|embed|source|track|wbr)$/i;
function tchar(c){const v=ta.value,p=ta.selectionStart,q=ta.selectionEnd;
 if(p===q&&S.set.ac){
  if(')]}"\''.includes(c)&&v[p]===c){ta.setSelectionRange(p+1,p+1);return}
  const qt=c==='"'||c==="'";if(PAIR[c]&&(!qt||!/\w/.test(v[p-1]||''))){ins(c+PAIR[c],1);return}
  if(c==='>'&&lang()==='html'){const b=v.slice(0,p),m=b.match(/<([A-Za-z][\w-]*)(?:\s[^<>]*)?$/);if(m&&!VOID.test(m[1])&&!b.endsWith('/')){ins('></'+m[1]+'>',m[1].length+3);return}}}
 ins(c)}
function enter(){const v=ta.value,p=ta.selectionStart,ls=v.lastIndexOf('\n',p-1)+1,b=v.slice(ls,p),ind=b.match(/^[ \t]*/)[0],pc=v[p-1],nx=v[p],u=U();
 if((pc==='{'&&nx==='}')||(pc==='>'&&nx==='<'&&v[p+1]==='/'))ins('\n'+ind+u+'\n'+ind,ind.length+1);
 else{const o=pc==='{'||(lang()==='html'&&(b.match(/<([a-z][\w-]*)(\s[^<>]*)?>$/i)||[0,'br'])[1]&&!VOID.test((b.match(/<([a-z][\w-]*)(\s[^<>]*)?>$/i)||[0,'br'])[1]));ins('\n'+ind+(o?u:''))}}
ta.addEventListener('beforeinput',e=>{if(busy||e.isComposing)return;
 if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){e.preventDefault();enter()}
 else if(e.inputType==='insertText'&&e.data&&e.data.length===1&&'(){}[]<>"\''.includes(e.data)){e.preventDefault();tchar(e.data)}});
ta.addEventListener('keydown',e=>{if(e.key!=='Tab')return;e.preventDefault();const a=ta.selectionStart,b=ta.selectionEnd,v=ta.value;
 if(a!==b&&v.slice(a,b).includes('\n')){const s=v.lastIndexOf('\n',a-1)+1,seg=v.slice(s,b),o=e.shiftKey?seg.replace(new RegExp('^( {1,'+S.set.ts+'}|\\t)','gm'),''):seg.replace(/^/gm,U());ta.setSelectionRange(s,b);ins(o);ta.setSelectionRange(s,s+o.length)}else ins(U())});
ta.addEventListener('input',()=>{S.files[S.active]=ta.value;sched();if(S.set.autosave){clearTimeout(tm);tm=setTimeout(save,600)}});
ta.addEventListener('scroll',sync);ta.addEventListener('blur',()=>setTimeout(sugg,50));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)requestAnimationFrame(upd)});
function toggleC(){const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd,s=v.lastIndexOf('\n',a-1)+1;let e=v.indexOf('\n',b);if(e<0)e=v.length;
 const ls=v.slice(s,e).split('\n'),h=lang()==='html',on=ls.every(l=>!l.trim()||(h?/^\s*<!--.*-->\s*$/:/^\s*\/\//).test(l));
 const o=ls.map(l=>!l.trim()?l:on?(h?l.replace(/<!--\s?/,'').replace(/\s?-->/,''):l.replace(/\/\/ ?/,'')):(h?l.replace(/^(\s*)(.*)$/,'$1<!-- $2 -->'):l.replace(/^(\s*)/,'$1// '))).join('\n');
 ta.focus();ta.setSelectionRange(s,e);ins(o);ta.setSelectionRange(s,s+o.length)}
/* suggestions */
const HT='div span p a ul ol li h1 h2 h3 h4 img button input form label table tr td th thead tbody section header footer nav main article aside canvas video audio select option textarea script style link meta title head body html br hr pre code strong em small'.split(' ');
const HA='class id style href src alt type name value placeholder onclick width height rel charset content lang title for action method disabled checked required target'.split(' ');
const HS={html5:'<!DOCTYPE html>\n<html lang="pl">\n<head>\n\t<meta charset="UTF-8">\n\t<meta name="viewport" content="width=device-width, initial-scale=1.0">\n\t<title>|</title>\n</head>\n<body>\n\t\n</body>\n</html>',link:'<link rel="stylesheet" href="|">',script:'<script>\n\t|\n<\/script>',style:'<style>\n\t|\n</style>',img:'<img src="|" alt="">',ul:'<ul>\n\t<li>|</li>\n</ul>',form:'<form action="|" method="post">\n\t\n</form>',input:'<input type="text" name="|">',table:'<table>\n\t<tr>\n\t\t<td>|</td>\n\t</tr>\n</table>',button:'<button>|</button>',div:'<div>|</div>'};
const CW='include using namespace return int double float bool char void const auto class struct public private static nullptr sizeof switch case break continue while for if else string vector map set unordered_map algorithm iostream sort size_t push_back begin end printf cout cin endl std'.split(' ');
const CS={main:'int main() {\n\t|\n\treturn 0;\n}',inc:'#include <|>',for:'for (int i = 0; i < |; i++) {\n\t\n}',while:'while (|) {\n\t\n}',if:'if (|) {\n\t\n}',cout:'std::cout << | << std::endl;',class:'class | {\npublic:\n\t\n};',struct:'struct | {\n\t\n};'};
let SG=[0,[]];
function sugg(){const el=$('sug');if(!S.set.sg||document.activeElement!==ta||ta.selectionStart!==ta.selectionEnd){el.classList.remove('on');return}
 const v=ta.value,p=ta.selectionStart,pre=v.slice(0,p),m=pre.slice(-40).match(/(<\/?)?([A-Za-z_!][\w-]*)$/);let list=[];
 if(m){const w=m[2],wl=w.toLowerCase();
  if(lang()==='html'){const it=pre.lastIndexOf('<')>pre.lastIndexOf('>');
   if(m[1])list=HT.filter(t=>t.startsWith(wl)&&t!==wl).map(t=>[t,m[1]==='</'?t+'>':t]);
   else if(it)list=HA.filter(t=>t.startsWith(wl)&&t!==wl).map(t=>[t,t+'="|"']);
   else if(w.length>1)list=Object.keys(HS).filter(k=>k.startsWith(wl)).map(k=>[k,HS[k]])}
  else if(w.length>1)list=Object.keys(CS).filter(k=>k.startsWith(w)).map(k=>[k,CS[k]]).concat(CW.filter(t=>t.startsWith(w)&&t!==w).map(t=>[t,t]));
  list=list.slice(0,8);SG=[w.length,list]}
 el.innerHTML=list.map((x,i)=>`<button data-i="${i}">${esc(x[0])}</button>`).join('');el.classList.toggle('on',list.length>0)}
$('sug').addEventListener('mousedown',e=>e.preventDefault());
$('sug').onclick=e=>{const it=SG[1][e.target.dataset.i];if(!it)return;const p=ta.selectionStart,v=ta.value,ind=v.slice(v.lastIndexOf('\n',p-1)+1,p).match(/^[ \t]*/)[0];
 let t=it[1].replace(/\t/g,U()).replace(/\n/g,'\n'+ind),back=0;const k=t.indexOf('|');if(k>=0){back=t.length-k-1;t=t.replace('|','')}
 ta.setSelectionRange(p-SG[0],p);ins(t,back)};
const KEYS=[['↶','undo'],['↷','redo'],['⇥','tab'],['//','cmt'],...'{}()[]<>;:"\'=/#&|*!,.-_'.split('').map(c=>[c,c])];
$('keys').innerHTML=KEYS.map(k=>`<button data-k="${esc(k[1])}">${esc(k[0])}</button>`).join('');
$('keys').addEventListener('mousedown',e=>e.preventDefault());
$('keys').onclick=e=>{const k=e.target.dataset.k;if(!k)return;ta.focus();
 if(k==='undo')document.execCommand('undo');else if(k==='redo')document.execCommand('redo');else if(k==='tab')ins(U());else if(k==='cmt')toggleC();else tchar(k)};
/* files */
function ui(){
 $('tabs').innerHTML=S.open.map(n=>`<div class="t ${n===S.active?'a':''}" data-n="${esc(n)}">${esc(n)}${n===S.active?'<span class="x" data-c="1">✕</span>':''}</div>`).join('');
 $('fl').innerHTML=Object.keys(S.files).sort().map(n=>`<div class="f ${n===S.active?'a':''}" data-n="${esc(n)}"><span class="g" style="background:${lang(n)==='html'?'#E37400':'#569cd6'}">${lang(n)==='html'?'HTML':'C++'}</span><span class="n">${esc(n)}</span><span class="x" data-r="${esc(n)}">✎</span><span class="x" data-d="${esc(n)}">✕</span></div>`).join('');
 $('ttl').textContent=S.active;$('lg').textContent=lang()==='html'?'HTML':'C++';ta.value=S.files[S.active]||'';nl=0;render();ta.scrollTop=0;sync()}
function openF(n){if(!S.open.includes(n))S.open.push(n);S.active=n;save();ui();$('side').classList.remove('open');$('scrim').classList.remove('on')}
function closeTab(n){S.open=S.open.filter(x=>x!==n);if(!S.open.length)S.open=[Object.keys(S.files)[0]];S.active=S.open[S.open.length-1];save();ui()}
const OKN=/^[\w.-]+\.(cpp|cc|c|h|hpp|html?)$/i;
$('tabs').onclick=e=>{const t=e.target.closest('.t');if(!t)return;e.target.dataset.c?closeTab(t.dataset.n):openF(t.dataset.n)};
$('fl').onclick=e=>{const d=e.target.dataset,f=e.target.closest('.f');
 if(d.d){if(confirm('Usunąć '+d.d+'?')){delete S.files[d.d];if(!Object.keys(S.files).length)S.files['main.cpp']='';S.open=S.open.filter(x=>x!==d.d);if(!S.open.length)S.open=[Object.keys(S.files)[0]];if(S.active===d.d)S.active=S.open[0];save();ui()}}
 else if(d.r){const n=prompt('Nowa nazwa:',d.r);if(!n||n===d.r)return;if(!OKN.test(n)||S.files[n]!==undefined){alert('Nieprawidłowa lub zajęta nazwa (tylko HTML i C++).');return}
  S.files[n]=S.files[d.r];delete S.files[d.r];S.open=S.open.map(x=>x===d.r?n:x);if(S.active===d.r)S.active=n;save();ui()}
 else if(f)openF(f.dataset.n)};
$('bn').onclick=()=>{const n=(prompt('Nazwa pliku (.cpp .h .html):','nowy.cpp')||'').trim();if(!n)return;if(!OKN.test(n)){alert('Tylko pliki HTML i C++.');return}
 if(S.files[n]===undefined)S.files[n]=lang(n)==='html'?'<!DOCTYPE html>\n<html lang="pl">\n<head>\n  <meta charset="UTF-8">\n  <title></title>\n</head>\n<body>\n  \n</body>\n</html>\n':'';openF(n)};
const side=o=>{$('side').classList.toggle('open',o);$('scrim').classList.toggle('on',o)};
$('bm').onclick=()=>side(!$('side').classList.contains('open'));$('scrim').onclick=()=>side(false);
/* find */
const fi=$('fi'),ri=$('ri'),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const matches=()=>{const q=fi.value.toLowerCase(),v=ta.value.toLowerCase(),r=[];if(!q)return r;let i=-1;while((i=v.indexOf(q,i+1))>=0)r.push(i);return r};
function findN(d){const m=matches(),q=fi.value.length;$('fc').textContent=m.length+' wyn.';if(!m.length)return;let i;
 if(d>0){i=m.find(x=>x>=ta.selectionEnd);if(i===undefined)i=m[0]}else{i=m.slice().reverse().find(x=>x<ta.selectionStart);if(i===undefined)i=m[m.length-1]}
 ta.focus();ta.setSelectionRange(i,i+q);reveal(i)}
$('bf').onclick=()=>{const o=$('find').classList.toggle('on');if(o){fi.focus();fi.select()}};
$('fn').onclick=()=>findN(1);$('fp').onclick=()=>findN(-1);fi.oninput=()=>{$('fc').textContent=matches().length+' wyn.'};
fi.onkeydown=e=>{if(e.key==='Enter')findN(1)};
$('r1').onclick=()=>{if(ta.value.slice(ta.selectionStart,ta.selectionEnd).toLowerCase()===fi.value.toLowerCase()&&fi.value)ins(ri.value);findN(1)};
$('ra').onclick=()=>{if(!fi.value)return;ta.focus();ta.select();ins(ta.value.replace(new RegExp(rx(fi.value),'gi'),()=>ri.value));$('fc').textContent='gotowe'};
$('pos').onclick=()=>{const n=parseInt(prompt('Przejdź do linii:'),10);if(n>0){const ls=ta.value.split('\n');let p=0;for(let i=0;i<Math.min(n-1,ls.length-1);i++)p+=ls[i].length+1;ta.focus();ta.setSelectionRange(p,p);reveal(p)}};
/* run */
const BR='<script>(function(){var s=function(t,a){parent.postMessage({nide:t,m:[].slice.call(a).map(String).join(" ")},"*")};["log","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,arguments);o.apply(console,arguments)}});onerror=function(m,u,l){s("error",[m+" (linia "+l+")"])}})()<\/script>';
function tab(t){$('pan').dataset.t=t;$('tp').classList.toggle('a',t==='pv');$('tc').classList.toggle('a',t==='co');if(t==='co')$('tc').textContent='Konsola'}
$('tp').onclick=()=>tab('pv');$('tc').onclick=()=>tab('co');$('px').onclick=()=>$('pan').classList.remove('on');$('pm').onclick=()=>$('pan').classList.toggle('max');
addEventListener('message',e=>{const d=e.data;if(d&&d.nide){$('co').textContent+=(d.nide==='error'?'✖ ':d.nide==='warn'?'⚠ ':'› ')+d.m+'\n';if($('pan').dataset.t!=='co')$('tc').textContent='Konsola •'}});
$('br').onclick=()=>{save();const f=S.active,c=S.files[f];$('pan').classList.add('on');
 if(lang(f)==='html'){tab('pv');$('co').textContent='';$('fr').srcdoc=BR+c}
 else{tab('co');$('co').textContent='Kompilacja '+f+' ('+S.set.compiler+')…';
  if(window.Android&&Android.runCpp)Android.runCpp(c,S.set.compiler,$('si').value);else onCppResult(JSON.stringify({compiler_error:'Uruchamianie C++ działa tylko w aplikacji Android.'}))}};
function onCppResult(s){let r;try{r=JSON.parse(s)}catch(e){r={compiler_error:s}}
 let t=(r.compiler_error||r.compiler_message||'');if(t&&!t.endsWith('\n'))t+='\n';t+=(r.program_output||'')+(r.program_error||'');
 if(r.status!==undefined)t+='\n[Zakończono, kod: '+r.status+']';$('co').textContent=t||'(brak wyjścia)'}
function handleBack(){const c=(id,cl)=>$(id).classList.contains(cl);
 if(c('set','on')){$('set').classList.remove('on');return true}if(c('side','open')){side(false);return true}
 if(c('find','on')){$('find').classList.remove('on');return true}if(c('pan','on')){$('pan').classList.remove('on');return true}return false}
/* settings */
function applySet(){const s=S.set,r=document.documentElement.style;r.setProperty('--fs',s.fs+'px');r.setProperty('--ts',s.ts);
 $('gut').style.display=s.ln?'':'none';$('keys').style.display=s.keys?'':'none';$('sp').textContent='Spaces: '+s.ts;render()}
const tg=(k,l)=>`<div class="row"><span>${l}</span><label class="sw"><input type="checkbox" data-s="${k}" ${S.set[k]?'checked':''}><i></i></label></div>`;
function setUI(){const s=S.set,names=Object.keys(S.files),bytes=names.reduce((a,n)=>a+new Blob([S.files[n]]).size,0),ua=navigator.userAgent;
 $('sb').innerHTML=`<h3>Edytor</h3>
 <div class="row"><span>Rozmiar czcionki<b id="fsv">${s.fs}px</b></span><input type="range" min="10" max="24" value="${s.fs}" data-s="fs"></div>
 <div class="row"><span>Szerokość tabulatora</span><select data-s="ts">${[2,4,8].map(n=>`<option ${n==s.ts?'selected':''}>${n}</option>`).join('')}</select></div>
 ${tg('ln','Numery linii')}${tg('keys','Pasek znaków')}${tg('sg','Podpowiedzi i snippety')}${tg('ac','Autozamykanie nawiasów i tagów')}${tg('autosave','Autozapis')}
 <h3>C++</h3><div class="row"><span>Kompilator zdalny</span><select data-s="compiler">${['gcc-head','clang-head'].map(c=>`<option ${c===s.compiler?'selected':''}>${c}</option>`).join('')}</select></div>
 <h3>Dane</h3><div class="btns"><button id="bx">Kopiuj kopię zapasową</button><button id="bi">Przywróć z wklejonej</button><button id="bz" style="color:#ff6b6b">Resetuj aplikację</button></div>
 <textarea id="imp" placeholder="Wklej tutaj kopię zapasową (JSON)…"></textarea>
 <h3>Informacje</h3><div class="about"><div class="lg">NEON<i>IDE</i></div><div class="v">MOBILE · WERSJA ${APP.ver}</div>
 <div class="mb">Made by <b>Neon</b> · <b>NeonCode Studio</b></div>
 <div class="inf"><span>Wersja</span><span>${APP.ver}</span><span>Kompilacja</span><span>${APP.build}</span><span>Kod wydania</span><span>${APP.code}</span><span>Języki</span><span>HTML, C++</span><span>Pliki</span><span>${names.length} (${(bytes/1024).toFixed(1)} KB)</span><span>Android</span><span>${(ua.match(/Android ([\d.]+)/)||[])[1]||'—'}</span><span>WebView</span><span>${(ua.match(/Chrome\/([\d.]+)/)||[])[1]||'—'}</span></div>
 <div style="color:var(--mut);font-size:11px;margin-top:14px">© 2026 NeonCode Studio. Wszelkie prawa zastrzeżone.</div></div>`}
function copyTxt(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
$('bg').onclick=()=>{setUI();$('set').classList.add('on')};$('sx').onclick=()=>$('set').classList.remove('on');
$('sb').addEventListener('input',e=>{const k=e.target.dataset.s;if(!k)return;const el=e.target;S.set[k]=el.type==='checkbox'?el.checked:(k==='fs'||k==='ts')?Number(el.value):el.value;
 if(k==='fs')$('fsv').textContent=S.set.fs+'px';save();applySet()});
$('sb').addEventListener('click',e=>{const t=e.target;
 if(t.id==='bx'){const ok=copyTxt(JSON.stringify({app:APP.code,files:S.files}));t.textContent=ok?'Skopiowano ✓':'Nie udało się';setTimeout(()=>t.textContent='Kopiuj kopię zapasową',1500)}
 else if(t.id==='bi'){try{const d=JSON.parse($('imp').value);if(!d.files||typeof d.files!=='object')throw 0;Object.keys(d.files).forEach(n=>{if(OKN.test(n)&&typeof d.files[n]==='string')S.files[n]=d.files[n]});save();ui();setUI();alert('Przywrócono pliki.')}catch(x){alert('Nieprawidłowa kopia zapasowa.')}}
 else if(t.id==='bz'&&confirm('Usunąć wszystkie pliki i ustawienia?')){try{localStorage.removeItem('nide');localStorage.removeItem('neon')}catch(x){}location.reload()}});
applySet();ui();
</script></body></html>
